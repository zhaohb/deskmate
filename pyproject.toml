[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deskmate"
version = "0.1.0"
description = "DeskMate — local-first desktop activity recorder for Windows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "DeskMate contributors" }]
keywords = ["activity", "recorder", "uia", "ocr", "memory", "windows"]

dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "tomli>=2.0; python_version<'3.11'",
    "mss>=9.0",
    "Pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "typer>=0.9",
    "httpx>=0.27",
    "anyio>=4.2",
    "pywin32>=306; platform_system=='Windows'",
    "comtypes>=1.4.8; platform_system=='Windows'",
    "uiautomation>=2.0; platform_system=='Windows'",
    "psutil>=5.9",
    # Native Windows toast for proactive habit reminders. Core (not optional):
    # without these the notifier silently falls back to the UI inbox and no
    # toast ever pops. Windows-only; degrades gracefully elsewhere.
    "winrt-Windows.UI.Notifications>=2.0; platform_system=='Windows'",
    "winrt-Windows.Data.Xml.Dom>=2.0; platform_system=='Windows'",
]

[project.optional-dependencies]
ocr-tesseract = ["pytesseract>=0.3.10"]
# RapidOCR = PP-OCR mobile (det+rec) on the OpenVINO CPU backend. Strong on
# Chinese + small UI text. Models (~16MB) ship with the rapidocr package.
ocr-rapidocr = ["rapidocr>=3.0", "openvino>=2024.0", "numpy>=1.26"]
ocr-winrt = ["winrt-Windows.Foundation>=2.0; platform_system=='Windows'", "winrt-Windows.Foundation.Collections>=2.0; platform_system=='Windows'", "winrt-Windows.Globalization>=2.0; platform_system=='Windows'", "winrt-Windows.Media.Ocr>=2.0; platform_system=='Windows'", "winrt-Windows.Graphics.Imaging>=2.0; platform_system=='Windows'", "winrt-Windows.Storage.Streams>=2.0; platform_system=='Windows'"]
audio = ["sounddevice>=0.4.6", "faster-whisper>=1.0", "numpy>=1.26", "soundfile>=0.12", "pyaudiowpatch>=0.2; platform_system=='Windows'"]
# OpenVINO GenAI Whisper backend (NPU/GPU/CPU). Models pulled from ModelScope.
audio-openvino = ["sounddevice>=0.4.6", "openvino-genai>=2024.4", "modelscope>=1.15", "numpy>=1.26", "soundfile>=0.12", "pyaudiowpatch>=0.2; platform_system=='Windows'"]
vad = ["silero-vad>=5.1", "torch>=2.0", "numpy>=1.26"]
speaker = ["pyannote.audio>=3.1", "torch>=2.0", "soundfile>=0.12", "numpy>=1.26"]
redact-onnx = ["onnxruntime>=1.17", "tokenizers>=0.15", "numpy>=1.26"]
redact-onnx-dml = ["onnxruntime-directml>=1.17; platform_system=='Windows'", "tokenizers>=0.15", "numpy>=1.26"]
mcp = ["mcp>=1.0"]
pipes = ["PyYAML>=6.0"]
semantic = ["fastembed>=0.3", "numpy>=1.26"]
# LoRA training via Unsloth (faster, lower-VRAM; CUDA / Intel XPU / AMD).
# unsloth pulls in transformers/peft/accelerate; they're listed too so the
# fallback path also works and versions stay explicit. For Intel GPUs, install
# the XPU torch wheel + `unsloth[intel-gpu-torch290]` per docs/16.
training = ["torch>=2.0", "unsloth>=2024.8", "transformers>=4.40", "peft>=0.10", "accelerate>=0.27"]
dev = ["pytest>=8.0", "ruff>=0.4"]
full = [
    "pytesseract>=0.3.10",
    "sounddevice>=0.4.6",
    "faster-whisper>=1.0",
    "soundfile>=0.12",
    "pyaudiowpatch>=0.2; platform_system=='Windows'",
    "silero-vad>=5.1",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "PyYAML>=6.0",
    "fastembed>=0.3",
    "numpy>=1.26",
    "winrt-Windows.UI.Notifications>=2.0; platform_system=='Windows'",
    "winrt-Windows.Data.Xml.Dom>=2.0; platform_system=='Windows'",
]

[project.scripts]
deskmate = "deskmate.engine.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["deskmate*"]

[tool.setuptools.package-data]
deskmate = ["ui/static/*.html", "ui/static/*.css", "ui/static/*.js"]
# Built-in pipe apps live under deskmate/apps. agent.py / common.py are real
# package modules; the per-app folders are hyphenated (day-recap, …) so they
# are NOT importable packages — their app.py / pipe.md ship as DATA files and
# are run as scripts (python <path>) / read at runtime. SKILL.md is shared.
"deskmate.apps" = ["*.md", "*/app.py", "*/pipe.md", "*/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]
